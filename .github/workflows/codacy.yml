# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Corre los domingos a las 7:00 AM UTC (1:00 AM hora CST México)
    - cron: '0 7 * * 0'
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          skip-failed-tools: true
          max-allowed-issues: 2147483647

      # Paso para consolidar múltiples 'runs' de SARIF en uno solo para compatibilidad con GitHub Code Scanning
      - name: Merge SARIF runs
        run: |
          node -e '
          const fs = require("fs");
          const sarifPath = "results.sarif";
          if (fs.existsSync(sarifPath)) {
            const sarif = JSON.parse(fs.readFileSync(sarifPath, "utf8"));
            if (sarif.runs && sarif.runs.length > 1) {
              console.log(`Unificando ${sarif.runs.length} ejecuciones de SARIF en 1 solo run...`);
              const combinedRun = sarif.runs[0];
              for (let i = 1; i < sarif.runs.length; i++) {
                const run = sarif.runs[i];
                if (run.results) {
                  combinedRun.results = (combinedRun.results || []).concat(run.results);
                }
                if (run.tool && run.tool.driver && run.tool.driver.rules) {
                  combinedRun.tool.driver.rules = (combinedRun.tool.driver.rules || []).concat(run.tool.driver.rules);
                }
              }
              sarif.runs = [combinedRun];
              fs.writeFileSync(sarifPath, JSON.stringify(sarif, null, 2));
              console.log("SARIF unificado exitosamente.");
            }
          }
          '

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: "codacy"
