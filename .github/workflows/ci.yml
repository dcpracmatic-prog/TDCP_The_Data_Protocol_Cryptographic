name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Test (protocol + auth/app-data + Authority)
        env:
          NODE_ENV: test
          MASTER_KEY_HEX: ${{ secrets.MASTER_KEY_HEX }}
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # package.json's "build" also runs db:migrate, which requires a configured
      # database and should not be an implicit side effect of a frontend CI build.
      - name: Build frontend bundle
        env:
          VITE_AUTH_ENABLED: "false"
        run: node --env-file-if-exists=.env scripts/with-app-env.mjs vite build

      - name: Script harness tests (informational)
        continue-on-error: true
        run: npm run test:scripts
