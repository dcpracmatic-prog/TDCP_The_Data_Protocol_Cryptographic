# TDCP local stack: web (demo UI) + Authorization Authority (durable MVP stub)
# HONESTY: Authority file store is NOT HSM/KMS. See docs/AUTHORITY.md

services:
  authority:
    build:
      context: .
      dockerfile: server/authority/Dockerfile
    ports:
      - "${TDCP_AUTHORITY_PORT:-8787}:8787"
    environment:
      - TDCP_AUTHORITY_PORT=8787
      - TDCP_AUTHORITY_DATA_DIR=/data/authority
      # Local compose default only — change before any shared deploy
      - TDCP_AUTHORITY_ADMIN_TOKEN=${TDCP_AUTHORITY_ADMIN_TOKEN:-local-dev-only-change-me}
      - TDCP_SIGNING_BACKEND=${TDCP_SIGNING_BACKEND:-file}
    volumes:
      - authority-data:/data/authority
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - VITE_AUTH_ENABLED=false
      - VITE_TDCP_AUTHORITY_URL=http://authority:8787
      - TDCP_AUTHORITY_URL=http://authority:8787
      # LOCAL DEMO ONLY — mirrors admin token into Vite for encrypt-via-UI against remote Authority
      - VITE_TDCP_AUTHORITY_ADMIN_TOKEN=${TDCP_AUTHORITY_ADMIN_TOKEN:-local-dev-only-change-me}
      - TDCP_AUTHORITY_ADMIN_TOKEN=${TDCP_AUTHORITY_ADMIN_TOKEN:-local-dev-only-change-me}
      - PORT=8080
    depends_on:
      authority:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  authority-data:
