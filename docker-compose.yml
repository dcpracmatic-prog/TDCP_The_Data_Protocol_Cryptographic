# TDCP local stack: web (demo UI) + Authorization Authority (durable MVP stub)
# HONESTY: Authority file store is NOT HSM/KMS. See docs/AUTHORITY.md

services:
  authority:
    build:
      context: .
      dockerfile: server/authority/Dockerfile
    ports:
      - "${TDCP_AUTHORITY_PORT:-8787}:8787"
    environment:
      - TDCP_AUTHORITY_PORT=8787
      - TDCP_AUTHORITY_DATA_DIR=/data/authority
      # Default stays token mode so ./scripts/start-prod-stack.sh keeps working.
      # For OIDC/mTLS see docs/ADMIN_AUTH.md (set TDCP_AUTHORITY_ADMIN_AUTH + related env).
      - TDCP_AUTHORITY_ADMIN_AUTH=${TDCP_AUTHORITY_ADMIN_AUTH:-token}
      # Local compose default only — change before any shared deploy; ignored when mode≠token
      - TDCP_AUTHORITY_ADMIN_TOKEN=${TDCP_AUTHORITY_ADMIN_TOKEN:-local-dev-only-change-me}
      - TDCP_SIGNING_BACKEND=${TDCP_SIGNING_BACKEND:-file}
      # Optional OIDC (pass through when set on host)
      - TDCP_OIDC_ISSUER=${TDCP_OIDC_ISSUER:-}
      - TDCP_OIDC_AUDIENCE=${TDCP_OIDC_AUDIENCE:-}
      - TDCP_OIDC_JWKS_URL=${TDCP_OIDC_JWKS_URL:-}
      - TDCP_OIDC_ADMIN_CLAIM=${TDCP_OIDC_ADMIN_CLAIM:-tdcp_admin}
      # Optional mTLS/HTTPS — mount certs and set paths, e.g.:
      #   volumes: [ ./data/mtls-dev:/certs:ro, authority-data:/data/authority ]
      #   TDCP_AUTHORITY_TLS_CERT_FILE=/certs/server.crt
      #   TDCP_AUTHORITY_TLS_KEY_FILE=/certs/server.key
      #   TDCP_MTLS_CA_FILE=/certs/ca.crt
      - TDCP_AUTHORITY_TLS_CERT_FILE=${TDCP_AUTHORITY_TLS_CERT_FILE:-}
      - TDCP_AUTHORITY_TLS_KEY_FILE=${TDCP_AUTHORITY_TLS_KEY_FILE:-}
      - TDCP_MTLS_CA_FILE=${TDCP_MTLS_CA_FILE:-}
      - TDCP_MTLS_ALLOWED_CNS=${TDCP_MTLS_ALLOWED_CNS:-}
    volumes:
      - authority-data:/data/authority
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - VITE_AUTH_ENABLED=false
      - VITE_TDCP_AUTHORITY_URL=http://authority:8787
      - TDCP_AUTHORITY_URL=http://authority:8787
      # LOCAL DEMO ONLY — mirrors admin token into Vite for encrypt-via-UI against remote Authority
      - VITE_TDCP_AUTHORITY_ADMIN_TOKEN=${TDCP_AUTHORITY_ADMIN_TOKEN:-local-dev-only-change-me}
      - TDCP_AUTHORITY_ADMIN_TOKEN=${TDCP_AUTHORITY_ADMIN_TOKEN:-local-dev-only-change-me}
      - PORT=8080
    depends_on:
      authority:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  authority-data:

# --- mTLS profile note (optional; does not change default stack) ---
# 1. ./scripts/gen-dev-mtls.sh
# 2. Mount data/mtls-dev into the authority service and set:
#      TDCP_AUTHORITY_ADMIN_AUTH=mtls
#      TDCP_AUTHORITY_TLS_CERT_FILE=/certs/server.crt
#      TDCP_AUTHORITY_TLS_KEY_FILE=/certs/server.key
#      TDCP_MTLS_CA_FILE=/certs/ca.crt
#      TDCP_MTLS_ALLOWED_CNS=tdcp-admin-dev
# Default ./scripts/start-prod-stack.sh remains token-mode HTTP on :8787.
